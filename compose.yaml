services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: dailynest
      POSTGRES_USER: dailynest
      POSTGRES_PASSWORD: dailynest_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dailynest -d dailynest"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://dailynest:dailynest_dev_password@db:5432/dailynest
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
